name: agentic-workflow-dev-env

services:
  workflow:
    image: ${IMAGE:-ghcr.io/OWNER/agentic-workflow-dev-env:latest}
    build:
      context: .
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-UTC}
      GH_TOKEN: ${GH_TOKEN:-}
      # OpenCode can read provider settings from its normal per-user paths.
      # Supply only the keys/providers you actually use.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - node_red_data:/data
      - ./workspace:/workspace
      # Keep optional OpenCode configuration and credentials outside the image.
      - ./opencode:/home/node/.config/opencode:ro
    restart: unless-stopped

volumes:
  node_red_data:
