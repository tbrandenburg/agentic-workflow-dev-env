name: agentic-workflow-dev-env

services:
  workflow:
    image: ${IMAGE:-ghcr.io/tbrandenburg/agentic-workflow-dev-env:latest}
    build:
      context: .
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-UTC}
      GH_TOKEN: ${GH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - node_red_data:/data
      - ./workspace:/workspace
    restart: unless-stopped

volumes:
  node_red_data:
